name: CI local

on: [push]

env:
  APP_HOST: 127.0.0.1
  APP_PORT: 3001

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
        
      - name: install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7